[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# One name everywhere: pip install decisionrl / import decisionrl.
name = "decisionrl"
version = "0.4.0"
description = "Applied reinforcement learning for operational decisions: pricing, inventory, energy, queues and supply chains — plus a correctness-first library of 32 algorithms."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Denis Drobyshev", email = "drobishev.denis@icloud.com" }]
keywords = [
    "reinforcement-learning",
    "deep-reinforcement-learning",
    "machine-learning",
    "pytorch",
    "dqn",
    "ppo",
    "sac",
    "td3",
    "rl",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# NumPy alone. PyTorch is an extra rather than a hard requirement: the environments,
# the classical baselines, the solvers and the core API are pure NumPy, and a consumer
# that only simulates or evaluates should not be made to install a multi-gigabyte wheel
# to do it. Everything that trains imports torch on first use and says so if it is
# missing -- see decisionrl/_lazy.py. Install `decisionrl[torch]` for the deep-RL half.
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
torch = ["torch>=1.13"]
gym = ["gymnasium>=0.29"]
config = ["pyyaml>=6.0.3"]
logging = ["tensorboard>=2.10"]
serve = ["onnx>=1.14", "onnxruntime>=1.16", "fastapi>=0.100", "uvicorn>=0.23"]
hub = ["huggingface_hub>=0.20", "onnx>=1.14", "onnxruntime>=1.16"]
dashboard = ["flask>=2.0", "plotly>=5.0"]
dev = [
    "torch>=1.13",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "pyyaml>=6.0.3",
    "ruff>=0.1",
    "gymnasium[classic-control]>=0.29",
    "matplotlib>=3.5",
    "mkdocs-material>=9.0",
    "tqdm>=4.60",
    "optuna>=3.0",
    "mypy>=1.0",
    "plotly>=5.0",
    "hypothesis>=6.0",
    "onnx>=1.14",
    "onnxruntime>=1.16",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "httpx>=0.28.1",
    "flask>=2.0",
]

[project.scripts]
decisionrl = "decisionrl.cli:main"

[project.urls]
Homepage = "https://github.com/DrobyshevDev/decisionrl"
Repository = "https://github.com/DrobyshevDev/decisionrl"
Issues = "https://github.com/DrobyshevDev/decisionrl/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/decisionrl"]

[tool.hatch.build.targets.sdist]
include = ["src/decisionrl", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: long-running learning/integration tests (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# UP (pyupgrade) is intentionally omitted: the library targets Python 3.9 and
# uses classic typing (Dict/Optional) with `from __future__ import annotations`.
select = ["E", "F", "I", "W", "B", "C4", "SIM"]
ignore = ["E501", "B008", "C401", "C408"]

[tool.ruff.lint.isort]
known-first-party = ["decisionrl"]

[tool.mypy]
# Analysis target: recent mypy no longer supports a 3.9 target. Runtime support for
# Python 3.9 is unchanged and is exercised by the 3.9 test job in CI.
python_version = "3.10"
files = ["src/decisionrl"]
ignore_missing_imports = true
implicit_optional = true
follow_imports_for_stubs = true
# Categories dominated by PyTorch / duck-typed space false positives are muted;
# name-resolution and structural checks stay on.
disable_error_code = [
    "arg-type",
    "attr-defined",
    "override",
    "operator",
    "index",
    "assignment",
]

# Pure, framework-agnostic modules are held to the full strict rule set: the six
# categories muted globally (for PyTorch / duck-typed env false positives) are turned
# back on here, so these modules are checked with everything enabled. Adding a module
# to this list is a commitment that it stays clean under strict typing.
[[tool.mypy.overrides]]
module = [
    "decisionrl.config",
    "decisionrl.tracking",
    "decisionrl.registry",
    "decisionrl.evaluation",
    "decisionrl.core.env",
    "decisionrl.core.types",
    "decisionrl.utils.seeding",
]
enable_error_code = [
    "arg-type",
    "attr-defined",
    "override",
    "operator",
    "index",
    "assignment",
]

# Don't analyze NumPy's stubs: their version resolved on Python 3.12 uses the
# PEP 695 `type` statement (unparseable under python_version 3.9) and NumPy 2.x
# shape typing is over-strict. Treat NumPy as Any so mypy is version-stable.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true

# Optional third-party integrations are treated as Any: we don't type-check their
# internals, and their sources may use syntax newer than our python_version floor
# (e.g. bokeh, pulled in transitively by huggingface_hub, uses 3.10 match statements).
# On CI these are simply not installed; skipping keeps local and CI results identical.
[[tool.mypy.overrides]]
module = ["huggingface_hub", "huggingface_hub.*", "bokeh", "bokeh.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.coverage.run]
source = ["decisionrl"]
branch = true

[tool.coverage.report]
# A floor, not the measured figure. The README used to carry a hand-written
# "86%" badge that nothing recomputed, which is the exact failure this project
# says it does not tolerate: a number in prose with nothing behind it. The badge
# is now generated from the run. Raise this floor to the measured value once the
# first report lands, and it ratchets from there.
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

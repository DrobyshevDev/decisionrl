site_name: decisionrl
site_description: A dependency-light, correctness-first reinforcement learning foundation
site_author: Denis Drobyshev
repo_url: https://github.com/DrobyshevDev/decisionrl
repo_name: DrobyshevDev/decisionrl
docs_dir: docs
edit_uri: ""

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Applied RL cookbook: cookbook.md
  - Case study (real data): case-study.md
  - Offline RL from logs: offline.md
  - Interpreting a policy: interpretability.md
  - Migrating from SB3/CleanRL: migration.md
  - Algorithms: algorithms.md
  - Benchmarks: benchmarks.md
  - Performance: performance.md
  - Robustness: robustness.md
  - Environments: environments.md
  - Multi-agent: multiagent.md
  - AlphaZero: alphazero.md
  - Meta-RL (RL²): meta.md
  - Contextual bandits: bandits.md
  - Off-policy evaluation: ope.md
  - Imitation learning: imitation.md
  - LLM alignment (RLHF): text.md
  - Evolution & swarm: evolution.md
  - Serving: serving.md
  - Command-line interface: cli.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
